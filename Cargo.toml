[package]
name = "rust-ai-bridge"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
hmac = "0.12"
native-windows-derive = "1.0"
native-windows-gui = { version = "1.0", default-features = false, features = [
    "clipboard",
    "combobox",
    "cursor",
    "file-dialog",
    "high-dpi",
    "image-decoder",
    "list-view",
    "menu",
    "message-window",
    "notice",
    "tabs",
    "textbox",
    "timer",
    "tray-notification",
] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
winapi = { version = "0.3", features = ["winuser"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.21"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"
